[package]
name = "emenda"
version = "0.1.0"
description = "A restrained desktop writing assistant"
authors = ["Emenda contributors"]
edition = "2021"
rust-version = "1.88"
default-run = "emenda"

[lib]
name = "emenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-e2e = [
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
    "dep:tempfile",
]

[[bin]]
name = "emenda-desktop-e2e-fixture"
path = "src/bin/desktop_e2e_fixture.rs"
required-features = ["desktop-e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
active-win-pos-rs = "0.8.4"
clipboard-rs = { version = "0.3.5", features = ["image"] }
enigo = { version = "0.2.1", default-features = false }

[dev-dependencies]
tempfile = "3"
