[package]
name = "emenda"
version = "0.1.0"
description = "A restrained desktop writing assistant"
authors = ["Emenda contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "emenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
active-win-pos-rs = "0.8.4"
clipboard-rs = { version = "0.3.5", features = ["image"] }
enigo = { version = "0.2.1", default-features = false }

[dev-dependencies]
tempfile = "3"
